services:
  labdeck:
    build: .
    # image: ghcr.io/tbk2020/labdeck:latest   # 发布后可直接用镜像
    container_name: haos-dashboard
    restart: unless-stopped
    ports:
      - "8383:8383"
    volumes:
      - ./data:/data          # services.yaml 与 labdeck.db 放这里
    environment:
      - LABDECK_PASSWORD=${LABDECK_PASSWORD:-}
      - LABDECK_MASTER_KEY=${LABDECK_MASTER_KEY:-}   # WebSSH 凭据库主密钥
      - LABDECK_TOTP=${LABDECK_TOTP:-}               # 终端二次确认（labdeck -gen-totp 生成）
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
