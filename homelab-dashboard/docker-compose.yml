services:
  labdeck:
    build: .
    # image: ghcr.io/tbk2020/labdeck:latest   # 发布后可直接用镜像
    container_name: haos-dashboard
    restart: unless-stopped
    ports:
      - "8383:8383"
    volumes:
      - ./data:/data          # services.yaml 与 labdeck.db 放这里
    # 所有变量集中在同目录 .env（git 忽略，模板见 .env.example）
    env_file:
      - path: .env
        required: false
