# labdeck 配置示例 —— 复制为 services.yaml 后按需修改。
# 所有 ${VAR} 会在加载时替换为同名环境变量，敏感信息不要写死在文件里。

listen: ":8383"

auth:
  # 非空则启用 HTTP Basic 认证（任意用户名 + 此密码）。生产环境务必设置。
  password: ${LABDECK_PASSWORD}
  # 终端二次确认用的 TOTP 密钥（labdeck -gen-totp 生成，导入认证器 App）
  totp_secret: ${LABDECK_TOTP}

defaults:
  interval: 30s          # 默认探测间隔
  timeout: 10s           # 默认单次超时
  failure_threshold: 3   # 连续失败 N 次才判宕机（防抖）
  success_threshold: 2   # 连续成功 N 次才判恢复
  cert_warn_days: 14     # 证书临期告警天数

# WebSSH 网关。启用需设置环境变量 LABDECK_MASTER_KEY（凭据库加密主密钥），
# 并通过 API 录入凭据：
#   curl -u admin:$PW -X POST http://<host>:8383/api/credentials \
#     -d '{"id":"pve-root","type":"password","username":"root","secret":"..."}'
# type 也可为 "key"，secret 填 PEM 私钥内容。首次连接自动固定主机指纹（TOFU）。
ssh:
  idle_timeout: 15m      # 终端空闲自动断开
  max_sessions: 5        # 并发终端上限
  require_totp: true     # 打开终端前要求输入动态验证码（需配置 auth.totp_secret）

notifiers:
  - type: telegram
    token: ${TELEGRAM_BOT_TOKEN}
    chat_id: "${TELEGRAM_CHAT_ID}"
  - type: webhook
    url: https://example.com/hooks/labdeck

# 深度适配器：拉取节点/VM/LXC/容器的实时资源用量，喂给"资源 Top"视图。
integrations:
  - id: pve
    name: Proxmox 主节点
    type: proxmox
    url: https://10.0.0.10:8006
    insecure_tls: true            # 自签证书
    token_id: root@pam!labdeck    # PVE API Token（只读权限即可）
    token_secret: ${PVE_TOKEN}
    interval: 10s
  - id: esxi-01
    name: ESXi 服务器
    type: esxi                    # 单机 ESXi 走 SOAP VIM API，免费许可证只读即可
    url: https://10.0.0.11
    insecure_tls: true
    username: labdeck-ro
    password: ${ESXI_PASS}
  - id: media-docker
    name: media-vm 上的 Docker
    type: docker
    endpoint: tcp://10.0.0.20:2375   # 或 unix:///var/run/docker.sock

hosts:
  - id: pve-01
    name: Proxmox 主节点
    address: 10.0.0.10
    ssh:
      port: 22
      user: root             # 省略则用凭据里的 username
      credential: pve-root   # 凭据库中的 id

services:
  - id: router
    name: 主路由 (OpenWrt)
    group: 网络
    urls:
      internal: http://10.0.0.1
    checks:
      - type: icmp
        address: 10.0.0.1
        interval: 15s
      - type: http
        url: http://10.0.0.1
        degraded_latency: 500ms

  - id: adguard
    name: AdGuard Home
    group: 网络
    depends_on: [router]   # 路由器宕机时本服务标记"不可达"且不重复告警
    urls:
      internal: http://10.0.0.2:3000
    checks:
      - type: tcp
        address: 10.0.0.2:53
      - type: http
        url: http://10.0.0.2:3000

  - id: pve
    name: Proxmox VE
    group: 虚拟化
    host: pve-01
    urls:
      internal: https://10.0.0.10:8006
    checks:
      - type: http
        url: https://10.0.0.10:8006
      - type: tls-cert
        address: 10.0.0.10:8006

  - id: jellyfin
    name: Jellyfin
    group: 媒体
    host: pve-01
    depends_on: [pve]      # 支持多级：pve 又可以 depends_on 路由器
    urls:
      internal: http://10.0.0.20:8096
      external: https://jf.example.com
    checks:
      - type: http
        url: http://10.0.0.20:8096/health
        keyword: Healthy
        degraded_latency: 1s

  - id: vaultwarden
    name: Vaultwarden
    group: 工具
    urls:
      internal: https://vault.lan.example.com
    checks:
      - type: http
        url: https://vault.lan.example.com/alive
      - type: tls-cert
        url: https://vault.lan.example.com
